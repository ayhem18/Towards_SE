# This file contains the default configuration for the backup manager 
#
# Note: These are default values that will be used if environment variables are not set
# You can override any of these by setting the corresponding environment variable
# Example: export BACKUP_MANAGER_HOME_DIR="/my/custom/backup/dir"

# ============================================================================
# DIRECTORY SETTINGS
# ============================================================================

# 1. The main backup manager home directory
_DEFAULT_BACKUP_MANAGER_HOME_DIR="$HOME/.backup_manager"

# 2. Local backup directory name (relative to home dir)
_DEFAULT_LOCAL_BACKUP_DIRNAME="local_backups"

# 3. Remote backup directory name (relative to home dir)
_DEFAULT_REMOTE_BACKUP_DIRNAME="remote_backups"

# 4. Cloud backup directory name (relative to home dir)
_DEFAULT_CLOUD_BACKUP_DIRNAME="cloud_backups"

# ============================================================================
# FILE SETTINGS
# ============================================================================

# 5. Default backup file extension
_DEFAULT_BACKUP_FILE_EXTENSION=".tar.gz"

# 6. Default compression type (none, gzip, bzip2, xz)
_DEFAULT_BACKUP_FILE_COMPRESSION="gzip"

# ============================================================================
# ENCRYPTION SETTINGS
# ============================================================================

# 7. Default encryption type (none, gpg, openssl)
_DEFAULT_ENCRYPTION_TYPE="none"

# 8. Default encryption algorithm for GPG
_DEFAULT_GPG_CIPHER="AES256"

# ============================================================================
# BACKUP SETTINGS
# ============================================================================

# 9. Default backup type (local, remote, cloud)
_DEFAULT_BACKUP_TYPE="local"

# 10. Maximum number of backups to keep
_DEFAULT_MAX_BACKUPS="10"

# 11. Default backup name pattern (timestamp will be added)
_DEFAULT_BACKUP_NAME_PATTERN="backup"

