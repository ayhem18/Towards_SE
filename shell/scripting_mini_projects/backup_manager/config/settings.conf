# Distributed Backup & Sync Manager Configuration
# 
# This file contains the main configuration settings for the backup system.
# Modify these values according to your environment and requirements.

# ============================================================================
# GENERAL SETTINGS
# ============================================================================

# Project name and version
PROJECT_NAME="backup_manager"
PROJECT_VERSION="1.0.0"

# Default backup method: local, ssh, s3, or auto
DEFAULT_BACKUP_METHOD="local"

# Default compression method: gzip, bzip2, xz, or none
DEFAULT_COMPRESSION="gzip"

# Enable encryption by default (true/false)
DEFAULT_ENCRYPTION="false"

# ============================================================================
# DIRECTORY SETTINGS
# ============================================================================

# Base directory for local backups
LOCAL_BACKUP_DIR="$SCRIPT_DIR/data/local"

# Temporary directory for backup operations
TEMP_DIR="$SCRIPT_DIR/data/temp"

# Log directory
LOG_DIR="$SCRIPT_DIR/logs"

# Maximum log file size in MB
MAX_LOG_SIZE="10"

# Number of log files to keep
LOG_RETENTION="5"

# ============================================================================
# BACKUP SETTINGS
# ============================================================================

# Default backup retention period (in days)
DEFAULT_RETENTION_DAYS="30"

# Maximum number of parallel backup jobs
MAX_PARALLEL_JOBS="3"

# Backup verification (true/false)
VERIFY_BACKUPS="true"

# Include hidden files and directories (true/false)
INCLUDE_HIDDEN="false"

# Follow symbolic links (true/false)
FOLLOW_SYMLINKS="false"

# ============================================================================
# REMOTE BACKUP SETTINGS (SSH)
# ============================================================================

# Default SSH user for remote backups
SSH_USER=""

# Default SSH key file (leave empty for default)
SSH_KEY_FILE=""

# SSH connection timeout (seconds)
SSH_TIMEOUT="30"

# SSH connection retry attempts
SSH_RETRY_ATTEMPTS="3"

# Remote backup base directory
REMOTE_BACKUP_DIR=""

# ============================================================================
# CLOUD STORAGE SETTINGS (S3)
# ============================================================================

# AWS S3 bucket name
S3_BUCKET=""

# AWS S3 region
S3_REGION="us-east-1"

# S3 storage class (STANDARD, STANDARD_IA, GLACIER, etc.)
S3_STORAGE_CLASS="STANDARD"

# ============================================================================
# ENCRYPTION SETTINGS
# ============================================================================

# GPG key ID for encryption (leave empty to prompt)
GPG_KEY_ID=""

# GPG cipher algorithm
GPG_CIPHER="AES256"

# GPG compression algorithm
GPG_COMPRESSION="2"

# ============================================================================
# NOTIFICATION SETTINGS
# ============================================================================

# Enable email notifications (true/false)
EMAIL_NOTIFICATIONS="false"

# Email address for notifications
EMAIL_ADDRESS=""

# SMTP server settings
SMTP_SERVER=""
SMTP_PORT="587"
SMTP_USER=""
SMTP_PASSWORD=""

# ============================================================================
# ADVANCED SETTINGS
# ============================================================================

# Enable debug mode (true/false)
DEBUG_MODE="false"

# Bandwidth limit for remote operations (KB/s, 0 = unlimited)
BANDWIDTH_LIMIT="0"

# Backup operation timeout (seconds, 0 = no timeout)
BACKUP_TIMEOUT="3600"

# Checksum algorithm: md5, sha1, sha256, sha512
CHECKSUM_ALGORITHM="sha256"
